# fly.toml app configuration file generated for murelapp on 2026-10-26T14:49:31-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'murelapp'
primary_region = 'gru'

[build]
  [build.args]
    APP_ENV = 'prod'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
