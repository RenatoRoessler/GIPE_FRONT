<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — GIPE</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #fff; color: #1a1d29; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #14161f; color: #f2f3f7; } }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; opacity: 0.75; }
      button { padding: 10px 20px; border: 0; border-radius: 8px; background: #2c5ce0; color: #fff; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>O GIPE precisa de internet para mostrar dados atualizados. Verifique sua conexão e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
